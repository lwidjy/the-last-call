ground:#1c292f;padding:16px;border:1px solid #3b4b52;font-size:13px}.choice:hover{border-color:var(--accent)}.choice small{display:block;color:var(--muted);margin-top:3px}.evidence-slip{background:#d9d3bd;color:#282b28;padding:25px;font:13px/1.9 monospace;transform:rotate(-1deg);margin:25px 0;box-shadow:0 10px 25px #0004}.evidence-slip .stamp{color:#8d3c31;border:1px solid;padding:3px 7px;font-size:10px;display:inline-block;margin-bottom:14px}.intro{min-height:calc(100dvh - 82px);position:relative;display:grid;grid-template-columns:1.2fr 1fr;align-items:center;padding:60px 9vw;gap:60px;overflow:hidden}.intro:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 75% 35%,#42626a55,transparent 55%),linear-gradient(135deg,#0c1215,#15242b 60%,#080e11);z-index:-1}.intro-copy{max-width:610px}.intro .lede{max-width:400px;color:#a4b2b7;font-size:15px;margin:24px 0 30px}.intro .eyebrow{margin-bottom:26px}.intro h1 span{color:var(--accent)}.intro-phone{max-width:300px;width:100%;justify-self:center;transform:rotate(5deg);animation:float 6s ease-in-out infinite}.incoming{text-align:center;padding:45px 20px 35px}.incoming .caller{width:76px;height:76px;margin:25px auto;border:1px solid #738f94;border-radius:50%;display:grid;place-items:center;color:#a7bcc0;font:32px Georgia;background:#293c44}.incoming h2{font:25px system-ui}.incoming .time{font:62px Georgia;margin:20px 0;color:#e0e6e2}.answer{width:60px;height:60px;border-radius:50%;background:#91b59a;color:#102b20;font-size:25px;margin:30px auto 8px;display:grid;place-items:center;box-shadow:0 0 0 10px #91b59a0b;animation:pulse 2s infinite}.transcript{border-left:2px solid var(--accent);padding:5px 0 5px 20px;margin:24px 0}.transcript p{font:21px/1.6 Georgia;color:#e4e5df}.audio-bars{height:50px;display:flex;gap:5px;align-items:center;justify-content:center;margin:22px}.audio-bars i{width:3px;background:var(--accent);height:var(--h);animation:wave 1.1s infinite alternate;animation-delay:var(--d)}.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#d7c5a0;color:#1e2729;padding:12px 22px;font-size:12px;z-index:30;box-shadow:0 8px 30px #0008;max-width:90vw;text-align:center}.check{display:flex;align-items:start;gap:12px;border:1px solid var(--line);padding:13px;font-size:12px}.check input{accent-color:var(--accent);width:18px;height:18px;flex:none}select{width:100%;padding:13px;color:var(--ink);background:#1c292f;border:1px solid #45565e;margin:8px 0 20px;font-size:14px}label.field{font-size:11px;color:var(--accent);letter-spacing:1px}.ending{text-align:center;padding:40px 15px}.ending h1{font-size:62px;letter-spacing:-2px}.ending p{max-width:530px;margin:20px auto;color:#aebcc0}.ending .seal{font:60px Georgia;color:var(--accent);margin:30px}.stats{display:flex;justify-content:center;gap:40px;margin:35px 0}.stats strong{font:28px Georgia;display:block;color:var(--accent)}.stats span{font:10px monospace;color:var(--muted)}@keyframes rain{to{transform:translate(-30px,100px)}}@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{50%{box-shadow:0 0 0 15px #91b59a12}}@keyframes float{50%{transform:rotate(3deg) translateY(-10px)}}@keyframes wave{to{transform:scaleY(.35)}}@media(max-width:1000px){.layout{gap:25px;grid-template-columns:minmax(0,1fr) 290px}.cards{grid-template-columns:1fr}.card{min-height:0;padding:17px}.card .symbol{float:left;margin:0 15px 0 0}.card .status{margin-top:5px}.scene{height:330px}}@media(max-width:700px){.top{height:65px;padding:0 21px}.brand{font-size:13px;letter-spacing:2px}.top-right{gap:10px}.save{font-size:8px}.sound{font-size:10px;padding:8px}.shell{padding:24px 20px max(24px,env(safe-area-inset-bottom))}.layout{display:flex;flex-direction:column;gap:30px}.chapter{margin-bottom:16px}.chapter .eyebrow{font-size:9px;letter-spacing:1.5px}.scene{height:280px}.scene-label{left:20px;bottom:18px}.scene-label h2{font-size:29px}.objective{margin:20px 0 16p <script>
'use strict';
const KEY='last-call-v1';const fresh=()=>({started:false,call:false,clues:[],interviews:{},messages:[],tab:'locations',ending:null});let s;try{s=JSON.parse(localStorage.getItem(KEY))||fresh();if(!Array.isArray(s.clues)||!s.interviews)s=fresh()}catch{s=fresh()}let sound=false,ctx,osc,gain,lastFocus;const $=id=>document.getElementById(id);let toastTimer;
const clues={recording:{name:'The 2:13 recording',type:'AUDIO / 00:18',text:'“It’s Mara. I found the payments. He said he could make this disappear. Three bells… water under the floor. Don’t call the police. Find me.”',note:'Three bells and water. Her location may be somewhere on the harbor.'},receipt:{name:'A late-night receipt',type:'PAPER / BLACKBIRD CAFÉ',text:'BLACKBIRD CAFÉ\n01:46 AM — TABLE 04\nTwo coffees. Paid: MARA VALE.\nHandwritten: “E. has the keys. Follow the money.”',note:'Mara met someone shortly before she vanished. The initial alone is not proof.'},ledger:{name:'The hidden ledger',type:'DOCUMENT / MARA’S LOCKER',text:'NORTHLINE REDEVELOPMENT\n$85,000 → E. SHAW\nAuthorization: ELIAS SHAW, security director\nMemo: Remove witness / before public hearing',note:'A financial motive, tied by full name to Elias Shaw.'},log:{name:'Harbor access log',type:'DIGITAL / GATE TERMINAL',text:'01:58 — E. SHAW — ENTRY\n02:04 — PUMP HOUSE 3 — MANUAL OVERRIDE\n02:31 — E. SHAW — EXIT\nCredential authentication: biometric',note:'Elias was at the pump house during the call. This contradicts his alibi.'},tide:{name:'The bell schedule',type:'NOTICE / HARBOR OFFICE',text:'FOG SIGNAL TEST — 02:10–02:15\nThree bells: Pump House 3\nTwo bells: Ferry terminal\nOne bell: North warehouse',note:'Three bells in Mara’s call locate her at Pump House 3.'},photo:{name:'June’s photograph',type:'PHOTO / 01:51 AM',text:'A timestamped image shows Mara getting into a Northline security car. Elias Shaw is visible behind the wheel.',note:'June trusted you enough to share the original image.'},alibi:{name:'An ambulance record',type:'DISPATCH / 01:50–02:40',text:'Patient: NOAH REED\nTreated for a hand injury at Eastside Emergency. Arrival confirmed by hospital CCTV.',note:'Noah’s angry message was real. So is his alibi.'},code:{name:'The service entrance',type:'WITNESS / JUNE PARK',text:'“The pump-house side door has an old keypad. Mara and I used it as kids. The code is 0213. Use that entrance. The front door triggers an alarm.”',note:'A quiet way in could keep Mara safe during the rescue.'}};
const people={june:{name:'June Park',role:'The best friend',initial:'JP',quote:'“She said this story would change everything. Then she stopped replying.”'},elias:{name:'Elias Shaw',role:'The security director',initial:'ES',quote:'“Mara was chasing ghosts. I was home by midnight. Ask anyone.”'},noah:{name:'Noah Reed',role:'The former partner',initial:'NR',quote:'“Yes, we fought. That doesn’t mean I wanted her gone.”'}};
function save(){try{localStorage.setItem(KEY,JSON.stringify(s));$('save').textContent='● PROGRESS SAVED'}catch{$('save').textContent='SAVE UNAVAILABLE'}}
function toast(t){$('toast').className='toast';$('toast').textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{$('toast').className='';$('toast').textContent=''},3200)}
function addClue(id){if(!s.clues.includes(id)){s.clues.push(id);save();toast('Evidence secured · '+clues[id].name)}}
function bars(){return '<div class="audio-bars" aria-hidden="true">'+Array.from({length:27},(_,i)=>`<i style="--h:${12+(i*17)%39}px;--d:${i*.07}s"></i>`).join('')+'</div>'}
function scene(){return `<div class="scene" role="img" aria-label="Rain falling over the old harbor and its illuminated pump house at night"><svg viewBox="0 0 900 450" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#233c46"/><stop offset="1" stop-color="#75827a"/></linearGradient><linearGradient id="water" x2="0" y2="1"><stop stop-color="#35484b"/><stop offset="1" stop-color="#0b1a21"/></linearGradient><radialGradient id="light"><stop stop-color="#ead8a0" stop-opacity=".4"/><stop offset="1" stop-color="#ead8a0" stop-opacity="0"/></radialGradient><pattern id="windows" width="29" height="27" patternUnits="userSpaceOnUse"><rect x="9" y="8" width="6" height="9" fill="#a9aa88" opacity=".22"/></pattern><filter id="fog"><feGaussianBlur stdDeviation="14"/></filter></defs><path fill="url(#sky)" d="M0 0h900v450H0z"/><circle cx="650" cy="88" r="43" fill="#c6d2c1" opacity=".12" filter="url(#fog)"/><path d="M0 230V145h50v-25h65v70h35V95h58v100h37v-42h77v65h35v-90h60v110h45V165h60v75h30V123h62v95h40V170h80v70h60V140h70v100h36v-47h80v257H0" fill="#26373d"/><path d="M0 230V145h50v-25h65v70h35V95h58v100h37v-42h77v65h35v-90h60v110h45V165h60v75h30V123h62v95h40V170h80v70h60V140h70v100h36v-47h80v257H0" fill="url(#windows)"/><path d="M0 285Q230 252 480 275T900 270V450H0Z" fill="url(#water)"/><path d="M500 230h270v95H500z" fill="#17272d"/><path d="M479 233l85-63h143l82 63z" fill="#142329"/><path d="M565 179v-60h44v60" fill="#1b2c31"/><path d="M574 139h22v25h-22zM535 252h31v28h-31zM590 252h31v28h-31zM699 252h31v28h-31z" fill="#d9bd7e" opacity=".6"/><path d="M643 261h30v64h-30z" fill="#050e13"/><path d="M500 325h277v10H500zM517 335v26m239-26v24" stroke="#12232a" stroke-width="8"/><path d="M595 300l-15 140h70l-18-140z" fill="#c9b77d" opacity=".07"/><path d="M10 350l380-31 103 41-380 90H0z" fill="#0d1b22"/><path d="M30 335v85m75-90v71m78-78v60m80-66v47m80-53v37M30 355l313-33" stroke="#1a2b31" stroke-width="6"/><path d="M385 310V143q0-17 18-17h20" stroke="#101f26" stroke-width="7" fill="none"/><path d="M409 132h30l-5 7h-20z" fill="#ead59b"/><ellipse cx="423" cy="226" rx="122" ry="140" fill="url(#light)"/><path d="M0 258q280-60 560 0t340-5" stroke="#c3d5ce" opacity=".13" stroke-width="30" filter="url(#fog)"/><path d="M800 55v240m0-225-145 96m145-96 90 77M655 166h235" stroke="#263c43" stroke-width="4" fill="none"/></svg><div class="rain"></div><span class="coordinates">40°42′ N / 74°00′ W</span><div class="scene-label"><span class="eyebrow">North harbor · Rain, 11°C</span><h2>A city keeping secrets.</h2><span class="small muted">Somewhere out there, Mara is still alive.</span></div></div>`}
function render(){if(s.ending)return renderEnding();if(!s.started){$('app').innerHTML=`<section class="intro"><div class="intro-copy"><div class="eyebrow">An interactive midnight mystery</div><h1>Some calls<br>change <span>everything.</span></h1><p class="lede">2:13 AM. A missing journalist. A voice that shouldn’t be calling you.<br><br>The city is asleep. Your night is just beginning.</p><button class="primary" onclick="start()">Answer the call &nbsp; →</button><p class="small muted" style="margin-top:24px">8–12 MINUTES &nbsp; / &nbsp; CHOICES HAVE CONSEQUENCES</p></div><div class="phone intro-phone" aria-hidden="true"><div class="phone-inner"><div class="phone-status">02:13 <span class="island"></span> ▰</div><div class="incoming"><span class="eyebrow">Incoming call</span><div class="caller">?</div><h2>Unknown caller</h2><p class="muted small">No caller ID</p><div class="time">02:13</div><div class="answer">⌕</div><span class="small muted">slide into the unknown</span></div></div></div></section>`;return}
$('app').innerHTML=`<div class="shell"><div class="chapter"><span class="eyebrow">Case 0213 &nbsp; / &nbsp; The disappearance</span><span class="muted">OCT 24 · 02:${String(13+s.clues.length*3).padStart(2,'0')} AM</span></div><div class="layout"><section>${scene()}<div class="objective"><span class="objective-icon">⌖</span><div><div class="eyebrow">Current objective</div><p>${s.clues.length<3?'Trace Mara’s last movements. Find evidence.':'Follow the contradictions. Build your deduction.'}</p></div></div><nav class="tabs" aria-label="Investigation"><button class="tab ${s.tab==='locations'?'active':''}" onclick="tab('locations')">Investigate <span class="count">03</span></button><button class="tab ${s.tab==='people'?'active':''}" onclick="tab('people')">Suspects <span class="count">03</span></button><button class="tab ${s.tab==='evidence'?'active':''}" onclick="tab('evidence')">Evidence <span class="count">${String(s.clues.length).padStart(2,'0')}</span></button></nav><div id="panel">${panel()}</div><button class="secondary wide" style="margin-top:20px" onclick="deduce()" ${s.clues.length<3?'disabled':''}>Connect the evidence &nbsp; → ${s.clues.length<3?'(collect 3 clues)':''}</button></section><aside class="phone" aria-label="Detective’s phone"><div class="phone-inner"><div class="phone-status">02:13 <span class="island"></span> ▥ ▰</div><div class="phone-head"><h3>Messages</h3><span class="small muted"><i class="live-dot"></i>Live</span></div><div class="phone-content"><div class="msg-time">TODAY, 2:13 AM</div><div class="sender">UNKNOWN NUMBER</div><div class="bubble">If you’re hearing this, something went wrong. You’re the only one I could call.</div><div class="bubble">Start at the Blackbird. My locker. <strong>213.</strong><br>Please hurry.</div><div class="bubble out">Mara? Stay with me.<br>I’m going to find you.</div>${s.messages.map(m=>`<div class="sender">CASE UPDATE</div><div class="bubble">${m}</div>`).join('')}<button class="phone-action" onclick="call(false)">▷ &nbsp; Open saved call · transcript</button><button class="phone-action" onclick="hint()">⌁ &nbsp; Ask dispatch for a lead</button></div><div class="homebar"></div></div></aside></div><footer class="footer"><span>EVERY DETAIL TELLS A STORY.</span><button class="link" onclick="resetPrompt()">Restart case</button></footer></div>`}
function panel(){if(s.tab==='locations')return `<div class="cards"><button class="card" onclick="locationView('cafe')"><span class="symbol">♧</span><strong>Blackbird Café</strong><span class="muted">Her last known stop</span><span class="status">${s.clues.includes('ledger')&&s.clues.includes('receipt')?'✓ SEARCHED':'SEARCH LOCATION →'}</span></button><button class="card" onclick="locationView('harbor')"><span class="symbol">⚓</span><strong>North Harbor</strong><span class="muted">The water remembers</span><span class="status">${s.clues.includes('log')&&s.clues.includes('tide')?'✓ SEARCHED':'SEARCH LOCATION →'}</span></button><button class="card" onclick="locationView('flat')"><span class="symbol">⌂</span><strong>Mara’s apartment</strong><span class="muted">A life interrupted</span><span class="status">READ HER NOTES →</span></button></div>`;if(s.tab==='people')return `<div class="cards">${Object.entries(people).map(([id,p])=>`<button class="card" onclick="interview('${id}')"><span class="symbol">${p.initial}</span><strong>${p.name}</strong><span class="muted">${p.role}</span><span class="status">${s.interviews[id]?'↳ '+s.interviews[id].label:'BEGIN INTERVIEW →'}</span></button>`).join('')}</div>`;return `<div class="cards">${s.clues.map(id=>`<button class="card" onclick="evidence('${id}')"><span class="symbol">${id==='recording'?'≋':'▤'}</span><strong>${clues[id].name}</strong><span class="muted">${clues[id].type}</span><span class="status">EXAMINE →</span></button>`).join('')}</div>`}
function tab(t){s.tab=t;save();render()}function start(){s.started=true;save();render();call(true)}
function modal(title,body,tag='CASE FILE'){lastFocus=document.activeElement;$('overlay').innerHTML=`<div class="veil" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="${title}"><div class="modal-top"><span class="eyebrow">${tag}</span><button class="close" aria-label="Close dialog" onclick="closeModal()">×</button></div><h2>${title}</h2>${body}</section></div>`;$('overlay').querySelector('button').focus()}
function closeModal(){$('overlay').innerHTML='';if(lastFocus&&lastFocus.isConnected)lastFocus.focus()}
function call(first){if(first){s.call=true;addClue('recording');render()}modal('Mara Vale',`<p class="muted">Unknown number · Recorded at 2:13 AM</p>${bars()}<div class="transcript"><p>“I found the payments. He said he could make this disappear.”</p><p>“Three bells… water under the floor. Don’t call the police. Find me.”</p></div><p class="small">[ A metallic bell rings three times. The line goes dead. ]</p><button class="primary wide" onclick="closeModal()">${first?'Begin the investigation':'Return to the case'} →</button>`,'SAVED CALL / TRANSCRIPT');tone()}
function locationView(id){if(id==='cafe')modal('Blackbird Café',`<p>The chairs are on the tables. Behind the counter, Mara’s coat is still hanging. The rain hasn’t touched it.</p><div class="choices"><button class="choice" onclick="collect('receipt','cafe')">Examine the receipt on table four <small>${s.clues.includes('receipt')?'✓ Evidence collected':'A handwritten note in the margin'}</small></button><button class="choice" onclick="locker()">Open staff locker 213 <small>${s.clues.includes('ledger')?'✓ Evidence collected':'Mara left you the number in a message'}</small></button></div>`,'LOCATION 01 / BLACKBIRD');if(id==='harbor')modal('North Harbor',`<p>A security terminal flickers beside the gate. Across the water, a bell cuts through the rain.</p><div class="choices"><button class="choice" onclick="collect('log','harbor')">Read the gate access terminal <small>Biometric entries · tonight</small></button><button class="choice" onclick="collect('tide','harbor')">Inspect the fog-signal notice <small>Three buildings. Three different signals.</small></button></div>`,'LOCATION 02 / HARBOR');if(id==='flat')modal('Mara’s apartment',`<p>A cold cup of tea. An empty camera bag. Three names circled on the wall.</p><div class="evidence-slip">JUNE — saw me leave. Scared. Don’t push her.<br><br>NOAH — angry voicemail. He hurt his hand tonight. Check the hospital.<br><br>ELIAS — Northline’s fixer. Says he went home. Check the harbor records.</div><button class="primary wide" onclick="closeModal();tab('people')">Interview the suspects →</button>`,'LOCATION 03 / HER NOTES')}
function locker(){modal('Locker 213',`<p>The door swings open. Beneath an apron, a ledger is wrapped in a brown paper envelope. Mara wrote one sentence on the front:</p><div class="transcript"><p>“If I vanish, this is why.”</p></div><button class="primary wide" onclick="collect('ledger','cafe')">Secure the ledger →</button>`,'BLACKBIRD / STAFF ROOM')}
function collect(id){addClue(id);render();evidence(id)}function evidence(id){const c=clues[id];modal(c.name,`<div class="evidence-slip"><span class="stamp">EVIDENCE ${String(Object.keys(clues).indexOf(id)+1).padStart(2,'0')}</span><div style="white-space:pre-line">${c.text}</div></div><p>${c.note}</p><button class="secondary wide" onclick="closeModal()">Return to investigation</button>`,c.type)}
function interview(id){const p=people[id],done=s.interviews[id];if(done){modal(p.name,`<p>${p.role}</p><div class="transcript"><p>${done.response}</p></div><p>${done.effect}</p>${id==='elias'&&s.clues.includes('log')&&done.label!=='CONTRADICTED'?`<button class="choice wide" onclick="respond('elias','proof')">Present the harbor access log</button>`:''}<button class="secondary wide" style="margin-top:18px" onclick="closeModal()">Close interview</button>`,'INTERVIEW / '+done.label);return}let options=id==='june'?`<button class="choice" onclick="respond('june','care')">“You’re safe with me. Help me bring her home.”<small>Reassure her · earn her trust</small></button><button class="choice" onclick="respond('june','push')">“If you’re hiding something, you’re involved.”<small>Apply pressure · risk losing her cooperation</small></button>`:id==='noah'?`<button class="choice" onclick="respond('noah','verify')">“Let’s verify your story. Where were you treated?”<small>Follow the facts</small></button><button class="choice" onclick="respond('noah','push')">“That voicemail sounds like a threat.”<small>Confront him directly</small></button>`:`<button class="choice" onclick="respond('elias','alibi')">“Tell me exactly when you left the harbor.”<small>Record his alibi</small></button>${s.clues.includes('log')?`<button class="choice" onclick="respond('elias','proof')">“Your biometric log tells a different story.”<small>Present the harbor access log</small></button>`:''}`;modal(p.name,`<p>${p.role}</p><div class="transcript"><p>${p.quote}</p></div><div class="choices">${options}</div>`,'PERSON OF INTEREST')}
function respond(id,choice){let r;if(id==='june'&&choice==='care'){r={label:'TRUST EARNED',response:'“I took a picture when she left. Elias was driving. And if you find her at the pump house… use the side entrance. The code is 0213.”',effect:'June shares her photograph and the service-door code. A quiet rescue is now possible.'};addClue('photo');addClue('code')}else if(id==='june'){r={label:'WITHDREW',response:'“I called you because I thought you would help. I’m not saying another word.”',effect:'June ends the call. Her photograph and entrance code are lost for this investigation. Physical evidence can still solve the case.'}}else if(id==='noah'&&choice==='verify'){r={label:'ALIBI VERIFIED',response:'“Eastside Emergency. I broke a glass after our argument. Check their cameras. I was there until 2:40.”',effect:'Dispatch confirms the hospital record. Noah could not have been at the harbor.'};addClue('alibi')}else if(id==='noah'){r={label:'DEFENSIVE',response:'“It was an argument. Not a confession. Talk to my lawyer.”',effect:'Noah stops cooperating. You will need to weigh the physical evidence without his verified alibi.'}}else if(choice==='proof'){r={label:'CONTRADICTED',response:'“Those logs… Listen. Northline paid me to stop the story. I only needed to keep her there until morning.”',effect:'His alibi breaks. You still need evidence of motive and a location before dispatch can act.'}}else{r={label:'ALIBI RECORDED',response:'“Midnight. Straight home. Never went near the water again. You’re wasting time.”',effect:'A precise claim. Find a record that can confirm or contradict it.'}}s.interviews[id]=r;s.messages.push(id==='june'&&choice==='care'?'June sent a photograph and a service-door code. Both are in your evidence file.':people[id].name+': interview filed. '+r.effect);save();render();interview(id)}
function hint(){let t=!s.clues.includes('ledger')?'Mara mentioned locker 213 at the Blackbird. Search it for a motive.':!s.clues.includes('log')?'The harbor terminal logs every entry. Compare it with Elias’s story.':!s.clues.includes('tide')?'The saved call has three bells. Check the harbor’s fog-signal notice.':!s.interviews.june?'June is frightened. A little reassurance might make the difference.':'You have the physical trail. Connect a motive and a presence at the scene, then use the bells to locate Mara.';s.messages.push(t);save();render();toast('Dispatch sent a lead')}
function deduce(){modal('Build your deduction',`<p>No guess is harmless. Name the person responsible, connect <strong>two pieces of evidence</strong>, and choose where to send the rescue team.</p><form id="deduction" onsubmit="submitDeduction(event)"><label class="field" for="culprit">WHO TOOK MARA?</label><select id="culprit" required><option value="">Choose a suspect</option>${Object.entries(people).map(([id,p])=>`<option value="${id}">${p.name}</option>`).join('')}</select><label class="field">WHICH TWO CLUES PROVE YOUR CASE?</label><div class="choices" style="margin:10px 0 20px">${s.clues.map(id=>`<label class="check"><input type="checkbox" name="proof" value="${id}"> ${clues[id].name}</label>`).join('')}</div><label class="field" for="destination">WHERE IS SHE BEING HELD?</label><select id="destination" required><option value="">Choose a location</option><option value="warehouse">North warehouse</option><option value="pump">Pump House 3</option><option value="ferry">Ferry terminal</option></select><p class="small">${s.clues.includes('code')?'✓ Service-door code available. Team will approach quietly.':'No service-door code. Team will enter through the front.'}</p><p id="form-error" role="alert" style="color:#e5bc79"></p><button class="primary wide" type="submit">Commit deduction & send the team →</button></form>`,'FINAL DECISION / IRREVERSIBLE')}
function resolve(culprit,proof,destination){const strong=proof.includes('ledger')&&(proof.includes('log')||proof.includes('photo'));return culprit==='elias'&&destination==='pump'&&strong?(s.clues.includes('code')?'saved':'escaped'):'lost'}
function submitDeduction(e){e.preventDefault();const proof=[...document.querySelectorAll('input[name="proof"]:checked')].map(i=>i.value);if(proof.length!==2){$('form-error').textContent='Select exactly two clues: a motive and evidence connecting the suspect to Mara’s disappearance.';return}const culprit=$('culprit').value,destination=$('destination').value;s.ending=resolve(culprit,proof,destination);s.decision={culprit,proof,destination};save();closeModal();render();window.scrollTo({top:0,behavior:'smooth'})}
function renderEnding(){const end={saved:{tag:'ENDING 01 / THE VOICE AT DAWN',title:'You answered.',body:'The side door opens without a sound. You find Mara beneath the pump-house stairs, alive. Elias is taken into custody before he can reach his car. Her ledger makes the morning edition.',after:'At 6:08 AM, your phone lights up again. “Coffee?” This time, there is no fear in her voice.'},escaped:{tag:'ENDING 02 / A TRUTH UNFINISHED',title:'One life. One loose end.',body:'Your evidence leads the team to Pump House 3. The front-door alarm gives Elias enough warning to escape, but Mara is rescued. The ledger exposes Northline. Somewhere in the city, a guilty man is still running.',after:'You found the truth. A witness’s trust could have helped you finish the job.'},lost:{tag:'ENDING 03 / DEAD AIR',title:'The wrong call.',body:'The team follows your deduction, but the case does not hold. By the time the mistake is clear, the pump house is empty. Mara’s phone has gone silent. The rain washes away the last tire tracks.',after:'A motive, a verified presence, and three bells. The answer was in the details.'}}[s.ending];$('app').innerHTML=`<div class="shell"><section class="ending"><div class="eyebrow">${end.tag}</div><div class="seal">${s.ending==='saved'?'☼':s.ending==='escaped'?'◒':'∅'}</div><h1>${end.title}</h1><p>${end.body}</p><p style="font-family:Georgia;font-style:italic;color:var(--accent)">${end.after}</p><div class="stats"><div><strong>${s.clues.length}/8</strong><span>CLUES SECURED</span></div><div><strong>${Object.keys(s.interviews).length}/3</strong><span>INTERVIEWS</span></div><div><strong>${s.interviews.june?.label==='TRUST EARNED'?'Yes':'No'}</strong><span>JUNE’S TRUST</span></div></div><button class="primary" onclick="review()">Review your deduction</button> <button class="secondary" onclick="resetPrompt()">Play again</button><p class="small muted">THE LAST CALL · A midnight investigation</p></section></div>`}
function review(){const d=s.decision;modal('Your case, reviewed',`<p><strong>Suspect:</strong> ${people[d.culprit].name}<br><strong>Evidence:</strong> ${d.proof.map(x=>clues[x].name).join(' + ')}<br><strong>Destination:</strong> ${{pump:'Pump House 3',warehouse:'North warehouse',ferry:'Ferry terminal'}[d.destination]}</p><div class="evidence-slip">The ledger establishes Elias’s motive. The biometric log or June’s photograph connects him to the disappearance. The three-bell signal identifies Pump House 3.</div><p>Reassuring June earns the service-door code, allowing the team to rescue Mara and arrest Elias without triggering the alarm.</p><button class="secondary wide" onclick="closeModal()">Close case review</button>`,'DEBRIEF')}
function resetPrompt(){modal('Start a new investigation?',`<p>This will replace your saved case. Your next approach may lead to a different ending.</p><div class="choices"><button class="primary" onclick="s=fresh();save();closeModal();render();window.scrollTo(0,0)">Start new case</button><button class="secondary" onclick="closeModal()">Keep this case</button></div>`,'RESTART')}
function tone(){if(!sound||!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=440;g.gain.setValueAtTime(.03,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+1);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+1)}
$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'Sound on':'Sound off';$('sound').setAttribute('aria-pressed',String(sound));if(sound){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();if(!osc){osc=ctx.createOscillator();gain=ctx.createGain();osc.type='sine';osc.frequency.value=62;gain.gain.value=.018;osc.connect(gain);gain.connect(ctx.destination);osc.start()}else gain.gain.value=.018;tone()}catch{sound=false;toast('Audio is unavailable in this browser');$('sound').textContent='Sound off';$('sound').setAttribute('aria-pressed','false')}}else if(gain)gain.gain.value=0};
document.addEventListener('keydown',e=>{if(!$('overlay').firstChild)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const els=[...$('overlay').querySelectorAll('button,input,select')].filter(el=>!el.disabled);const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});document.addEventListener('visibilitychange',()=>{if(gain)gain.gain.value=document.hidden?0:(sound?.018:0)});render();
</script></body></html>
